logging:
  register-shutdown-hook: true
  level:
    web: debug
    com.motcs.*: debug

server.port: ${SERVER_PORT:8080}

spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${NEO4J_AUTH_USERNAME:neo4j}
      password: ${NEO4J_AUTH_PASSWORD:sx2011++}

  r2dbc:
    url: r2dbc:mysql://${app.r2dbc.url}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${app.r2dbc.username}
    password: ${app.r2dbc.password}
    pool:
      max-size: 20
      initial-size: 5

  ai:
    openai:
      api-key: ${app.zhipu.api-key}
      base-url: ${app.zhipu.url}
      timeout: ${AI_TIMEOUT:300s}   # 默认60s太短，思考模型+高峰期易流超时，调大到5分钟
      chat:
#        model: ${AI_CHAT_MODEL:glm-5.3-flash}
        model: ${app.ai.default-chat-model}
        temperature: ${AI_CHAT_TEMPERATURE:0.1}
    vectorstore:
      neo4j:
        index-name: knowledge_vector_index
        embedding-dimension: ${app.zhipu.embedding.dimension}
        label: DocumentChunk
        distance-type: cosine
        initialize-schema: true

# 应用配置
app:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: ${FILE_MAX_SIZE:52428800}  # 50MB

  zhipu:
    url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_API_KEY:default}
    embedding:
      model: ${AI_EMBEDDING_MODEL:embedding-3}
      dimension: ${AI_EMBEDDING_DIMENSION:2048}
  # 当前启用的 AI 平台与前端可选对话模型（前端通过 /api/ai/provider 获取后动态渲染模型下拉框）
  ai:
    # 平台标识：zhipu（智谱，默认 prod profile）/ baidu（百度千帆，baidu profile 覆盖）
    provider: ${AI_PROVIDER:zhipu}
    provider-name: ${AI_PROVIDER_NAME:智谱 AI}
    # 前端对话界面可选模型（逗号分隔），需与当前平台已开通模型一致
    chat-models: ${AI_CHAT_MODELS:glm-4-flash,glm-5.3-flash}
    default-chat-model: ${AI_CHAT_MODEL:glm-4-flash}

  r2dbc:
    url: ${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:motcs}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:sx2011++}