# ============================================================
# 百度千帆（Qianfan）专项配置
# 用途：将 AI 模型从智谱（Zhipu）替换为百度千帆，复用 Spring AI 的
#       OpenAI 兼容接口（spring-ai-starter-model-openai），零新增依赖。
#
# 启用方式：
#   本地 bootRun：  --spring.profiles.active=baidu
#   或环境变量：    SPRING_PROFILES_ACTIVE=baidu
#   注意：application.yaml 默认 profile 为 prod，需显式切换。
#
# 必填环境变量（或用默认值）：
#   AI_API_KEY              千帆控制台创建的 API Key（bce-v3/... 开头）
#   AI_BASE_URL             默认 https://qianfan.baidubce.com/v2
#   AI_CHAT_MODEL           对话模型，默认 ernie-speed-128k（免费）
#                           - 免费跑通：ernie-speed-128k
#                           - 追求质量：ernie-4.5-turbo-128k（新用户送100万token）
#   AI_EMBEDDING_MODEL      向量模型，默认 bge-large-zh（1024 维，中文）
#   AI_EMBEDDING_DIMENSION  向量维度，必须与向量模型一致：1024
#
# ⚠️ 迁移注意：
#   1. 向量模型由智谱 embedding-3（2048 维）换为 bge-large-zh（1024 维），
#      Neo4j 的 knowledge_vector_index 是按 2048 维创建的，需先删除旧索引
#      （启动时 initialize-schema=true 会自动按 1024 重建），
#      且存量文档需重新上传/重新向量化，否则检索失效。
#   2. 千帆 embedding 接口单次提交文本条数有限制（bge-large-zh 官方约 16 条/次），
#      若大文档整体批量向量化报错，需在 DocumentService 中分批提交。
# ============================================================

logging:
  register-shutdown-hook: true
  level:
    web: debug
    com.motcs.*: debug

server.port: ${SERVER_PORT:8080}

spring:
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
    authentication:
      username: ${NEO4J_AUTH_USERNAME:neo4j}
      password: ${NEO4J_AUTH_PASSWORD:sx2011++}

  r2dbc:
    url: r2dbc:mysql://${app.r2dbc.url}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${app.r2dbc.username}
    password: ${app.r2dbc.password}
    pool:
      max-size: 20
      initial-size: 5

  ai:
    openai:
      # 千帆 OpenAI 兼容接口鉴权：Bearer <API Key>，key 以 bce-v3/ 开头
      api-key: ${app.qianfan.api-key}
      # https://qianfan.baidubce.com/v2
      #   chat  → /v2/chat/completions
      #   embed → /v2/embeddings
      base-url: ${app.qianfan.url}
      timeout: ${AI_TIMEOUT:300s}   # 思考模型+高峰期易流超时，保持 5 分钟
      chat:
        # 免费档推荐 ernie-speed-128k（128k 上下文，不会被 RAG 上下文撑爆）；
        # 要质量/更稳的 JSON 抽取换 ernie-4.5-turbo-128k
#        model: ${AI_CHAT_MODEL:deepseek-v3.2}
        model: ${AI_CHAT_MODEL:deepseek-v3.2-think}
        temperature: ${AI_CHAT_TEMPERATURE:0.1}
    vectorstore:
      neo4j:
        index-name: knowledge_vector_index
        embedding-dimension: ${app.qianfan.embedding.dimension}
        label: DocumentChunk
        distance-type: cosine
        initialize-schema: true

# 应用配置
app:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: ${FILE_MAX_SIZE:52428800}  # 50MB

  # ============ 百度千帆（Qianfan）配置 ============
  qianfan:
    # 千帆 OpenAI 兼容接口地址
    url: ${AI_BASE_URL:https://qianfan.baidubce.com/v2}
    # 千帆控制台 → 应用接入 → API Key（bce-v3/...）
    api-key: ${AI_API_KEY:default}
    embedding:
      # 中文向量模型 bge-large-zh：1024 维，单次最多约 16 条文本，每条约 512 token
      model: ${AI_EMBEDDING_MODEL:bge-large-zh}
      dimension: ${AI_EMBEDDING_DIMENSION:1024}

  # 兼容 AiConfig 读取的旧键名（代码无需改动），值统一引用上方 qianfan 配置
  zhipu:
    url: ${app.qianfan.url}
    api-key: ${app.qianfan.api-key}
    embedding:
      model: ${app.qianfan.embedding.model}
      dimension: ${app.qianfan.embedding.dimension}

  r2dbc:
    url: ${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:motcs}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:sx2011++}